spring:
  application:
    name: sentinel-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentineluba}
    username: ${DB_USERNAME:sentineluba_user}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8081}